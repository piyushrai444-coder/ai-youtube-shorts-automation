services:
  - type: web
    name: ai-yt-shorts-automation
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-yt-shorts-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DAILY_SHORT_COUNT
        value: "2"
      - key: SHORT_1_TIME
        value: "10:00"
      - key: SHORT_2_TIME
        value: "19:00"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: RESEARCH_PROVIDER
        value: rss
      - key: TTS_PROVIDER
        value: openai
      - key: TTS_API_KEY
        sync: false
      - key: TTS_VOICE
        value: alloy
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        value: us-east-1
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: YOUTUBE_PRIVACY_STATUS
        value: public
      - key: CHANNEL_NAME
        value: "AI Daily Radar"
      - key: WATERMARK_TEXT
        value: "@AIDailyRadar"
      - key: DEFAULT_CTA
        value: "Follow for daily breakthrough AI tools 🚀"
      - key: ENABLE_BACKGROUND_MUSIC
        value: "false"

databases:
  - name: ai-yt-shorts-db
    plan: starter
    databaseName: ai_shorts_db
    user: ai_shorts_user
